  open_questions:
  - 'CDG pre-2001 season digit (0 = AW, 1 = SS after the hyphen): three Japanese guides and five museum-dated codes
    agree, but Noir ''AO-31010S'' (NGV SS1990) has a 3. Check more museum-dated Noir and export pieces, and find
    out whether the E prefix on NGV''s export women''s pieces (1983, 1995, 1998) is an export marker like the X
    on menswear export tags.'
  - 'CDG 2001 transition: note.com says SS2001 still used the old format and AW2001 production mixed old and new;
    Truss lists A/B for SS2001. Confirm with dated AD2001 tags whether A/B exist and which lines switched first.'
  - CDG earliest tags (1969-1981 'ruled-line' tags; 1969-72 tags without company name) rest on a single collector
    blog (note.com). Verify with dated museum or catalogue pieces.
  - '''D-TK9210'' window (about SS1984 to SS1998) comes from two collector sources. Confirm on museum-dated Japanese-label
    pieces, and check whether any export labels carry it.'
  - 'CDG SHIRT: verify the embroidered bilingual early labels (1988-SS1994), the side-sewn tags (AW1995-SS2001),
    Hong Kong production in the late 1990s, the AD1994 ''FW-01033S'' example, the third-position letter in S/W codes,
    and whether the F line letter starts SS2021 or AW2021.'
  - 'CDG Homme: brand-label wording and artwork for 1984-1989, and the first Junya Watanabe season (fashion-press
    says he took over in 2003; kaitorihanbaiichiba groups Tanaka Homme as 1990-2004). Homme Deux launch year.'
  - 'CDG Homme Plus: does ''EVER GREEN'' on PS-T209 (SS2007) mean the Evergreen sub-line, and do Evergreen pieces
    have their own codes?'
  - 'Junya Watanabe: confirm on garments that men''s labels dropped ''COMME des GARÇONS'' from SS2022 as fashion-press
    states (press coverage of the SS2022 men''s show still used the old name).'
  - 'Margiela: in which season did brand text on labels, care tags and soles switch from ''Maison Martin Margiela''
    to ''Maison Margiela''? A Truss photo shows an AW2014 care label still reading ''Maison Martin Margiela'', while
    NGV''s AW2014-15 mules (credited to Galliano) read ''Maison Margiela''.'
  - 'Margiela: NGV describes SS2015 Artisanal labels as ''two rows of numbers'' versus three rows (0-9 / 10-16 /
    17-23) on 2007-2008 labels. Did the grid layout change? When did women''s Line 1 move from the all-white label
    to the numbered label (nssmag says 2008)?'
  - Margiela care codes (991..., 0012..., 'YYYY 01/02') and the Japan distributor-tag scheme come from geeksblog
    plus two Truss photos. Check them on non-Japan-market pieces, MM6 and Line 22 shoes. Decode modern style references
    such as 'S29AM0093'.
  - 'MM6: was the rebrand in June 2004 (Secundo Store) or 2006 (nssmag)? What did the early Line 6 label look like
    (numbered label with 6 circled vs ''MM6'' wordmark), and when did the straight-line stitching start?'
  - 'Undercover: verify geeksblog''s pre-2015 code formats on dated garments (8-character codes to SS1998, digits-only
    AW1998, the irregular 1999-2004 letter table, year digit + S/A for 2005-2007, leading season letter A-O for
    2008-2015). Did tags change from ''（有）'' to ''（株）アンダーカバー'' after the January 2000 incorporation? What do the
    ''UI'' (AW2021) and ''UAP'' prefixes mean?'
  - 'Undercover: document brand-label artwork per era (font, colours, woven vs printed, UNDERCOVER vs UNDERCOVERISM
    wording, the ''hand print'' tags mentioned in forums). No fetched source covers it. Watch for label or code
    changes after the September 2026 HUMAN MADE acquisition agreement.'
  - 'Yohji: geeksblog is the only source for season letters after AW2020 (including the ''V or E'' and ''M or L''
    entries) and for the round-to-angular logo change at AW1991 and stamped-to-printed care labels at SS2010. Check
    these on dated garments, plus the Y''s line letter M and the Y''s for men pause (SS2010-AW2023).'
  - Japan's care-symbol switch (new JIS L 0001 from 1 Dec 2016; revised again from Aug 2024 per the Consumer Affairs
    Agency) is a cross-brand cue for Japanese-made CDG, Yohji, Undercover and Number (N)ine tags. Confirm the first
    AD year or season with new symbols for each brand.
  - 'Number (N)ine: compare physical tags from the Miyashita era (1996-2009), the Kooks era (n(n) by number (n)ine,
    NUMBER (N)INE DENIM, RE：Number (N)ine remakes) and 2025+ ''by Takahiro Miyashita'' tags: wording, company names
