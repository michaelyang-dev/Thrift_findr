      start_year: 2008
      end_year: 2017
      label_cues: 'One letter per season from A = SS2008 to T = AW2017 (Truss table; geeksblog; bazzstore). Japanese
        care label example: HG-T029 / AD2010 with a red 縫製責任者 seal and ''日本製 株式会社 コム デ ギャルソン 東京都港区南青山5-11-5'' (Truss
        photo). Listings agree: GD-T036 AD2009, PE-B041 AD2009, HG-B030 AD2010 (11SS), GL-T043 (2013AW), PN-N025
        and HN-N011 AD2014 (14AW), GO-P001 AD2014, DO-J072 AD2014 (15SS), TQ-T011 AD2015 (16SS), GR-N006 (2016AW),
        HS-P050 AD2016, PS-T058 (2017SS). Staple items use Z as the second letter, probably from about AD2011 (note.com).
        Japan''s new JIS L 0001 care symbols apply from 1 December 2016 (Consumer Affairs Agency), so tags made
