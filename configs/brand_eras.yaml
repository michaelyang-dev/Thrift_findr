  - brand: Maison Margiela (Maison Martin Margiela; numbered-line labels)
    eras:
    - name: Martin Margiela blank-label era (before the numbered label)
      start_year: 1988
      end_year: 1996
      label_cues: 'Blank white cotton label attached by four white tacks that show on the outside as four stitched
        points (NGV AW1990-91; Wikipedia: ''simple blank white labels with four white tacks''; V&A). Printed white
        cotton season labels read ''COLLECTION / PRINTEMPS ETE / 1989'' or ''COLLECTION / AUTOMNE HIVER / 1991-1992'',
        with a woven script ''Made in Italy'' tab (Truss photos; Truss dates these labels 1988-1993). NGV transcribes
        the same label as ''COLLECTION / AUTUMNE HIVER / 1990-91 / Made in Italy'' and ''... 1992-1993''; the photographed
        spelling is AUTOMNE. Concept labels: bilingual ''REPRODUCTION D''UNE SERIE DE VETEMENTS ANCIENS / REPRODUCTION
        OF A SERIES OF OLD GARMENTS'' (NGV AW1992-93). Early-1990s care tags, French-made tags and ''BY MISS DEANNA''
        knitwear tags carry no readable date (geeksblog). Japan-market pieces from AW1996 add a distributor tag
        with company code ''D-HG1118'' (Orizzonti), printed blue or black (geeksblog).'
      sources:
      - https://www.trussarchive.com/guides/how-to-identify-maison-margiela
      - https://cdn.prod.website-files.com/64f1d2cc5e0dab718e3de0c4/64f1d4bbbd89d831972d783d_646c67d4e5f92f9700fc00c5_margiela%252B1989%252Blabel.jpeg
      - https://en.wikipedia.org/wiki/Maison_Margiela
      - https://api.vam.ac.uk/v2/museumobject/O1807544
      - https://www.nssmag.com/en/fashion/19578/the-meaning-of-maison-martin-margiela-s-numbers
      - https://www.intoarchive.com/editorials/maison-margiela-numbers-label-guide
      - https://geeksblog.jp/margiela-tag
      - https://www.ngv.vic.gov.au/explore/collection/work/154816/
      - https://www.ngv.vic.gov.au/explore/collection/work/58814/
      confidence: high
    - name: Numbered 0-23 label under Martin Margiela (women's Line 1 stays all-white)
      start_year: 1997
      end_year: 2009
      label_cues: 'From 1997 a white cotton label printed in black with 0-23 in three rows (0-9 / 10-16 / 17-23),
        the line number circled (Truss; nssmag; intoarchive; Wikipedia; NGV Artisanal SS2007 and AW2008 with 0 circled;
        AW2006 bag). The four white tacks remain. Women''s Line 1 (the défilé collection) kept an all-white label
        until about 2008 (nssmag): the V&A records Margiela''s ''plain white rectangle label'' on AW1997 linen jackets;
        NGV records blank labels tacked at the corners on an AW1997-98 wig and an AW1999-2000 duvet coat (with a
        separate woven ''MADE / IN / ITALY / M'' label), and four-point white stitching on a 1997 dress that also
        has a ''Tissu de Paris'' label. The AW1997 ''42 / SEMI COUTURE / PARIS / BREVETE S.G.E.G / 35059'' is printed
        on the linen jacket to copy a dressmaker''s form; it is not a label (V&A). Care tags: from 1999 a ''COMM.''
        number whose last digits give year and season (991 = SS1999 ... 011 = SS2001; then 0012 = AW2001 ... 0092
        = AW2009) (geeksblog); Truss shows ''COMM. 01592/0042'' (AW2004) on a care label reading ''PRODOTTO DA:
        STAFF INTERNATIONAL S.P.A.'' and ''MARTIN MARGIELA''. Japan distributor tags: Orizzonti AW1998-AW2001 (mixed
        with company-code tags in SS1998), ''KOKONOE CO.,LTD.'' AW2000-AW2001, ここのえ株式会社 SS2002-AW2011 (geeksblog).
        New lines: MM6 1997, shoes (Line 22) 1998, men''s Line 10 SS1999 (Truss). OTB acquired the house in 2002
        (Wikipedia); no label change is documented for it.'
      sources:
      - https://www.trussarchive.com/guides/how-to-identify-maison-margiela
      - https://cdn.prod.website-files.com/64f1d2cc5e0dab718e3de0c4/6512cd5b4c5ca89fa20b07a0_Untitled%20(6).jpeg
