      photographed examples ''PRINTEMPS ETE 1989'' and ''AUTOMNE HIVER 1991-1992''). NGV transcribes ''AUTUMNE'';
      include both spellings in an OCR lexicon. (2) Care-tag ''COMM.'' number from 1999 (geeksblog, with Truss examples):
      SS1999-SS2001 = last 3 digits YY + season (991 SS99, 992 AW99, 001 SS00, 002 AW00, 011 SS01); AW2001-SS2010
      = last 4 digits = last three digits of the year + season (0012 AW01 ... 0092 AW09; 00101 SS10); from AW2010
      = ''YYYY 01'' (SS) or ''YYYY 02'' (AW), e.g. Truss''s ''2014 02'' = AW2014. Truss (single source for scope)
      says the code is on lines 10 and 14 and most other lines except shoes (22) and Miss Deanna knitwear; Truss''s
      example ''COMM. 01592/0042'' = AW2004 matches geeksblog. Truss''s claim that 1992-2001 pieces are mostly undatable
      holds only before 1999. Not datable: early-1990s care tags, French-made (e.g. Artisanal) tags, ''BY MISS DEANNA''
      knit tags and tags retrofitted on some boutique stock (geeksblog). (3) Japan-market distributor tags (geeksblog):
      company-code ''D-HG1118'' tag (blue or black) AW1996-SS1998; Orizzonti AW1998-AW2001; ''KOKONOE CO.,LTD.''
      AW2000-AW2001; ここのえ SS2002-AW2011; Staff International AW2011-AW2017; Margiela Japan from SS2018. The reverse
      carries ''333-?N...'' with N = 9 (AW1996 or AW2000, told apart by distributor), 2 SS97, 3 AW97, 4 SS98, 5
      AW98, 6 SS99, 7 AW99, 8 SS00; then a 10-digit number whose first digit is 2 SS01, 3 AW01, 4 SS02, 5 AW02,
      6 SS03, 7 AW03, 8 SS04, 9 AW04; no number from SS2005. (4) Modern style references such as ''S29AM0093'' (on
      the 2014 label) are not decoded.'
