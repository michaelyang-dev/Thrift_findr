# Label-based era definitions for the real (label-photo) data.
# DRAFT from web research (collector guides, museum records, retailer listings), fact-checked by a second
# pass on 2026-10-28. Every era lists the sources that support it and a confidence; verify against
# physical garments before training on these labels. `proposed_classes` is the coarser class set we plan
# to train on (neighbouring eras are merged if a class has fewer than 50 label photos).
proposed_classes:
  Comme des Garcons:
  - label: pre-1988
    years:
    - 1969
    - 1987
    cue: no AD year on the care label
  - label: 1988-2000
    years:
    - 1988
    - 2000
    cue: AD year + hyphenated code with season digit
  - label: 2001-2007
    years:
    - 2001
    - 2007
    cue: first season-letter code series
  - label: 2008-2017
    years:
    - 2008
    - 2017
    cue: season letters A=SS2008 ... T=AW2017
  - label: 2018-
    years:
    - 2018
    - 2026
    cue: season letters restart at A=SS2018
  Maison Margiela:
  - label: 1988-1996
    years:
    - 1988
    - 1996
    cue: blank white label, four white tacks
  - label: 1997-2008
    years:
    - 1997
    - 2008
    cue: numbered 0-23 label, Martin Margiela
  - label: 2009-2014
    years:
    - 2009
    - 2014
    cue: design team, still 'Maison Martin Margiela'
  - label: 2015-
    years:
    - 2015
    - 2026
    cue: '''Maison Margiela'' (Galliano, then Martens)'
  Undercover:
  - label: 1990-2002
    years:
    - 1990
    - 2002
    cue: Tokyo era; year-digit / season-letter codes
  - label: 2003-2014
    years:
    - 2003
    - 2014
    cue: Paris era; men's mainline as UNDERCOVERISM
  - label: 2015-2020
    years:
    - 2015
    - 2020
    cue: unified UNDERCOVER; 'UC' + season letter
  - label: 2021-
    years:
    - 2021
    - 2026
    cue: '''UC'' + 1/2 + year letter (A=2021)'
research:
  brands:
  - brand: Comme des Garçons (main women's line + house-wide care-tag/code system)
    eras:
    - name: 'Earliest tags: no style code, then ruled-line care tags'
      start_year: 1969
      end_year: 1981
      label_cues: 'One collector guide (note.com, Tsukiyama, 2025) describes the earliest inner tags: 1969-72 tags
        carry no style number, no fibre content and no company name; from the 1970s the company name (株式会社 コム デ
        ギャルソン, company formed 1973) is added, still without material or style number; ''ruled-line'' (罫線) care tags,
        some with stamped numbers and in several fonts, were used from the 1970s until about AW1981. geeksblog describes
        early-1980s tags as very small wrap-around tags. No museum example from this period was found, so these
        cues are unverified.'
      sources:
      - https://note.com/tkiy_0/n/n48d20e755ff3
      - https://geeksblog.jp/comme-des-garcons-tag
      - https://www.encyclopedia.com/fashion/encyclopedias-almanacs-transcripts-and-maps/comme-des-garcons
      - https://www.fhcm.paris/en/node/574
      confidence: low
    - name: Typed style codes with season digit, no AD year
      start_year: 1981
      end_year: 1988
      label_cues: 'From AW1981 the ruled lines disappear and style numbers are typed rather than stamped (note.com).
        Code = [line letter][garment letter][season digit 0 = AW, 1 = SS][digits]; NGV''s SS1983 top has the unhyphenated
        ''ET100160'' (digit 1 = SS, matching the museum date) on a printed ''COMME des GARÇONS / MADE IN JAPAN /
        FABRIQUE AU JAPON / 100% COTTON'' label. Main labels: printed black on white synthetic (NGV SS1983; NGV
        notes a mark under the C) or on white polyester (NGV c.1985 jumpsuit), or woven bronze on black synthetic
        (NGV AW1983-84). From about SS1984 Japanese care labels print the textile-labeller number ''D-TK9210'' (D
        = retailer, TK = Tokyo, 9210 = Comme des Garçons); it is absent on AW1983 main-line pieces (kaitorihanbaiichiba;
        note.com). No AD year until AW1988 production (note.com; geeksblog). Sub-lines launched: Homme 1978, tricot
        and robe de chambre 1981, Homme Plus 1984, Noir 1987 (encyclopedia.com).'
      sources:
      - https://www.ngv.vic.gov.au/explore/collection/work/76984/
      - https://www.ngv.vic.gov.au/explore/collection/work/127450/
