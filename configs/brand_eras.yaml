    date_codes: 'Two printed elements on the white care/composition label, which usually sits low on a side seam
      (VFG forum). (1) AD + 4-digit year = PRODUCTION year, not season (Truss; Fashionsnap 製造年; note.com). CDG launches
      SS in February and AW in August, so SS goods normally carry the previous year (note.com: rarely the same year):
      NGV''s SS1998 jacket has ''AD 1997'' on the reverse; listings pair PA-B018/AD2017 with 18SS, PG-J053/AD2020
      with 21SS and GO-B019/AD2024 with 25SS, while AW goods carry the same year (PN-N025/AD2014 = 14AW). AD appears
      from AW1988 production (note.com; geeksblog; earliest listing GP-05032M AD1988) and only on clothing; bags
      have none (note.com). (2) STYLE CODE, AW1981-SS2001 (note.com; geeksblog; bazzstore): [line][garment]-[season
      digit][4 digits][size letter or 0]. Season digit 0 = AW, 1 = SS, so AD N + 0 = AW N and AD N + 1 = SS N+1
      (bazzstore: GJ-110710 AD1991 = SS1992). Museum checks: ET100160 (SS1983), ES-10017M (SS), EJ-10006M and EO-10054M
      (SS1998), GO-04021M (AW1993) all fit; Noir ''AO-31010S'' (SS1990) does not (digit 3). This contradicts Truss''s
      statement that pre-2001 codes carry no season. In the codes collected here a size letter ends 5-digit codes
      (EJ-10006M on a size-M piece; AO-31010S on a size-S piece) and 6-digit codes end in 0 (PT-050200, PV-110010,
      HT-080270). Garment letters: J jacket, C coat, N knit, V vest, T top/T-shirt/jersey, O dress, S skirt, P pants,
      B blouse/shirt, A overalls, U jumpsuit, K accessories and bags (Truss; geeksblog; bazzstore). Export tags
      on 1990s menswear start with X (geeksblog), e.g. XJ-07027M (V&A 1996 Homme Plus coat). STYLE CODE, AW2001
      onward: [line][season letter]-[garment letter][3 digits] (Truss). Season letters: AW2001 C/D, SS2002 E/F,
      AW2002 G/H, SS2003 I/J, AW2003 K/L, SS2004 M ... AW2007 T; SS2008 A ... AW2017 T; SS2018 A ... SS2026 Q, AW2026
      R (Truss table; geeksblog; bazzstore). DECODER: let i be the letter index (A = 0). If AD is 2000-2003 and
      the letter is A-L, use pairs: s = floor(i/2), SS if s is even, AW if odd, year = 2001 + floor(s/2). Otherwise:
      SS if i is even, AW if odd, year = base + floor(i/2), with base 1998 (letters M-T only, AD2003-2007), 2008
      or 2018 (2028 next), chosen so that AD = year (AW) or year - 1 (SS). Fixed second letters: Z = staple, no
      season (from about AD2011; note.com); PLAY uses AZ, and AX from AD2023 (note.com). Other non-collection goods
      seen: VZ-T041 (CDG x The Beatles tee, AD2025), OX-T005 (AD2023 track jacket), OA-K201 (backpack), PZ-K205
      (Homme Plus backpack). Exception: some 2006SS Rolling Stones tees carry P (geeksblog). LINE LETTERS (Truss;
      geeksblog; bazzstore): G CDG; R CDG CDG or robe de chambre; T tricot (Tao from SS2022); 3 tao COMME des GARÇONS
      (2005-SS2011) and later Noir Kei Ninomiya (from SS2013); P Homme Plus; H Homme; D Homme Deux; I Homme Homme;
      J Junya Watanabe; W Junya Watanabe MAN and eYe; U Junya Watanabe MAN PINK; A PLAY; 1 BLACK CDG; N CDG GIRL;
      E Ganryu; B parfums (Truss); O and V wallet and other non-collection goods; F SHIRT (from 2021; earlier SHIRT
      codes start with an S/W season prefix, which is probably why Truss lists ''S'' for SHIRT). Pre-2001 observations:
      E on export main-line pieces (NGV 1983, 1995, 1998), G on domestic main line (1988, 1993, 2000 listings and
      NGV 1993), A on Noir 1990, X on export Homme Plus tailoring 1996-1999. (3) ''D-TK9210'' printed on Japanese
      care labels from about SS1984 to SS1998 (kaitorihanbaiichiba; note.com).'
    notes: 'The woven main label ''COMME des GARÇONS'' looks stable in museum records from 1983 to 2006 (bronze,
      gold or yellow on black), with printed black-on-white labels in the same collections, so label colour follows
      garment type, not era. Date from the care tag (AD year, code format, D-TK9210, care symbols). NGV catalogue
      dates often but not always put SS pieces in the previous calendar year (SS1996 ''Kaleidoscope'' catalogued
      as 1995; SS1998 pieces catalogued as both 1997 and 1998). The post-2001 season table is now corroborated by
      the Truss table image and three independent Japanese reseller guides (geeksblog, bazzstore, note.com), and
      about 40 fril.jp listings agree with it. Seller-stated seasons can still be wrong: DI-J033 (Homme Deux, AD2021)
      was sold as 2021SS, while I = SS2022.'
  - brand: Comme des Garçons Homme Plus
    eras:
    - name: 'Pre-2001 tags: P- codes with season digit (AD year from AW1988); X- codes on export tailoring'
      start_year: 1984
      end_year: 2001
      label_cues: 'Label text ''Comme des Garçons / Homme Plus'' with a separate S/M/L size label; export care text
        ''Do not bleach / Use cool iron / Dry clean only / Comme des Garçons / Made in Japan'' and ''Comme des Garçons
        Co., LTD.'' (V&A 1992 coat, trousers, waistcoat; 1996 suit). Japanese care label example: 品番 PV-110010,
        AD1991, ''(株)コム デ ギャルソン D-TK9210'' (Truss photo). Codes = P + garment letter + ''-'' + season digit (0 =
        AW, 1 = SS) + 4 digits + size letter or 0: PT-050200 (AD1992), PB-100280 (AD1995), PC-040200 and PJ-04057L
        (AD1996), PJ-10033 and PT-100480 (AD1997), PJ-04086S, PJ-040910 and PT-100470 (AD1998) (listings). Export
        tailoring uses X codes (geeksblog: export codes start with X): XJ-07027M (V&A 1996 coat, size M), XJ-07068M
        (sold as 1999AW), XJ-01079L (AD1999, sold as AW1999 ''Souvenir Kitsch''). No AD year before AW1988; ''D-TK9210''
        on Japanese labels until SS1998 (kaitorihanbaiichiba).'
