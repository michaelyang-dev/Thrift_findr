    - name: Post-2001 code, first season-letter series (AW2001-AW2007)
      start_year: 2001
      end_year: 2007
      label_cues: 'Code becomes [line][season letter]-[garment letter][3 digits] (Truss; note.com; geeksblog). Season
        letters (Truss table credited to ''Playful Blog''; geeksblog; bazzstore agree): C or D = AW2001, E or F
        = SS2002, G or H = AW2002, I or J = SS2003, K or L = AW2003, then one letter per season M = SS2004 to T
        = AW2007. Truss also lists A or B for SS2001, which note.com says was used only on a few items. Museum check:
        GE-O007 on NGV''s SS2002 ''Ethnic Couture'' dress (printed white side label) = E = SS2002. Truss photo:
        WK-P029 / AD2003 (K = AW2003). Listing: GQ-T037 (2006SS). Main labels stay woven yellow on black (NGV AW2003
        ''COMME des GARCONS / M'', AW2006) with printed white labels on bottoms; one woven white-on-blue label is
        recorded (design SS2003, 2007 reissue, NGV). Tao Kurihara''s separate line tao COMME des GARÇONS (AW2005-SS2011;
        line digit 3) used printed ''t a o / COMME des GARCONS'' labels on cream cotton (NGV AW2006). PLAY launched
        2002 (AnOther).'
