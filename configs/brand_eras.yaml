      - https://geeksblog.jp/comme-des-garcons-tag
      - https://www.encyclopedia.com/fashion/encyclopedias-almanacs-transcripts-and-maps/comme-des-garcons
      confidence: medium
    - name: AD year + pre-2001 hyphenated code (garment letter 2nd, season digit 3rd)
      start_year: 1988
      end_year: 2001
      label_cues: 'From AW1988 production care labels add ''AD'' + production year (note.com; geeksblog; earliest
        seen in a listing: GP-05032M with AD1988). Code = [line][garment]-[0 = AW / 1 = SS][4 digits][size letter
        or 0]: GO-04021M (NGV AW1993-94), ES-10017M and ''O 10019M'' (NGV ''(1995) spring-summer''), EJ-10006M and
        EO-10054M with ''AD 1997'' on the reverse (NGV SS1998), GS-04063S AD2000 (listing sold as 2000AW), PV-110010
        AD1991 (Truss photo). Japanese domestic labels print 品番 (style no.), the AD year, a 縫製責任者 (sewing supervisor)
        field and ''(株)コム デ ギャルソン D-TK9210'' (Truss photo). Export pieces in NGV have white plastic bilingual labels
        (''MAIN / ATTACHED FABRIC / TISSUS AJOUTE'', ''COMME des GARCONS CO., LTD.'', ''MADE IN JAPAN / FABRIQUE
        AU JAPON'') with Japanese text and the AD year on the reverse. ''D-TK9210'' disappears from garments made
        from 1998 (last on SS1998, absent from AW1998), after Japan''s 1997 revision of the textile labelling rules
        (kaitorihanbaiichiba; note.com). Main label: woven gold/yellow on black (jackets and some dresses) and printed
        black on white acetate or synthetic (skirts, trousers, many dresses) appear in the same collections (NGV
        AW1995-96, SS1998, AW1998-99). Noir: woven white on black ''COMMEdes GARÇONS / NOIR'' (NGV SS1990, code
        AO-31010S). robe de chambre: woven black on white ''robe de chambre COMME des GARÇONS / MADE IN JAPAN''
        (NGV SS1997). The old format runs through SS2001 (note.com cites an AD2001 ''PJ-10067M''); AW2001 production
        mixes old and new formats. Sub-lines: SHIRT 1988, Junya Watanabe 1992, CDG CDG 1993 (encyclopedia.com).'
