[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thriftfindr"
version = "0.1.0"
description = "Brand, era and price prediction for second-hand archive garments from label photos"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
